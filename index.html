<title>🌳 ចំការលុយ | FD Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy&#43;Pro:wght@400;600;700&amp;family=Noto&#43;Sans&#43;Khmer:wght@400;600;700&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--bg2:#0f1830;--card-b:rgba(255,255,255,.09);--txt:#eef3ff;--mut:#92a4c6;--gold:#f5b942;--gold2:#ffd98a;--em:#22c997}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Kantumruy Pro','Noto Sans Khmer','Inter',system-ui,sans-serif;color:var(--txt);min-height:100vh;
  background:radial-gradient(900px 500px at 85% -10%,rgba(245,185,66,.16),transparent 60%),radial-gradient(800px 500px at -10% 10%,rgba(34,201,151,.14),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
.num{font-family:'Inter','Kantumruy Pro',sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:28px 16px 40px}
.p-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.p-logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--gold),var(--em));box-shadow:0 8px 24px rgba(245,185,66,.3)}
.p-head h1{font-size:26px;line-height:1.3}
.p-head h1 span{background:linear-gradient(90deg,var(--gold),var(--em));-webkit-background-clip:text;background-clip:text;color:transparent}
.p-head p{color:var(--mut);font-size:14px;margin-top:2px}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:18px}
.o-empty .btn{display:none}
.bank-av{display:none}
@media(max-width:520px){.tree{width:46%;max-width:170px}.p-head h1{font-size:21px}}
 
.orchard{border-radius:26px;overflow:hidden;border:1px solid var(--card-b);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sky{position:relative;padding:22px 20px 70px;overflow:hidden;
  background:linear-gradient(180deg,#1b6fb8 0%,#5db6f0 55%,#bfe6fb 100%)}
.sun{position:absolute;right:7%;top:16px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle,#fff6c2 0%,#ffd45a 55%,#ffb92e 100%);box-shadow:0 0 0 14px rgba(255,214,90,.25),0 0 60px 20px rgba(255,214,90,.5);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 22px rgba(255,214,90,.18),0 0 80px 30px rgba(255,214,90,.55)}}
.cloud{position:absolute;height:26px;width:90px;border-radius:30px;background:rgba(255,255,255,.85);opacity:.9;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:38px;height:38px;left:12px;top:-18px}.cloud:after{width:48px;height:48px;right:10px;top:-24px}
.cloud.c1{top:40px;left:-120px;animation-duration:70s}
.cloud.c2{top:100px;left:-120px;animation-duration:95s;animation-delay:-40s;transform:scale(.7)}
.cloud.c3{top:20px;left:-120px;animation-duration:120s;animation-delay:-80s;transform:scale(.55)}
@keyframes drift{to{left:110%}}
.o-stats{position:relative;z-index:2;display:flex;gap:12px;flex-wrap:wrap}
.o-chip{background:rgba(8,16,34,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 16px;min-width:140px}
.o-chip small{display:block;color:#cfe2ff;font-size:12px}
.o-chip b{font-size:18px;color:#fff;font-family:'Inter','Kantumruy Pro',sans-serif;font-variant-numeric:tabular-nums}
.o-chip b.gold{color:var(--gold2)}
.field-wrap{position:relative;margin-top:-46px;padding-top:30px;
  background:linear-gradient(180deg,#4fae45 0%,#3c9a3a 18%,#2f8230 60%,#25682a 100%);border-radius:50% 50% 0 0/38px 38px 0 0}
.grove{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 8px;padding:10px 14px 30px;min-height:240px}
.tree{position:relative;width:170px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-top:46px}
.tree .tsvg{display:block;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes grow{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
.crown{transform-origin:60px 95px;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.fruit{animation:fpulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.tlabel{margin-top:4px;text-align:center;background:rgba(6,18,12,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);
  border-radius:14px;padding:7px 10px;width:100%}
.tlabel .bn{display:flex;align-items:center;gap:6px;justify-content:center;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.tlabel .bn span{overflow:hidden;text-overflow:ellipsis}
.tlabel .bn img{width:18px;height:18px;border-radius:5px;background:#fff;object-fit:contain;flex-shrink:0}
.tlabel .ps{font-size:11.5px;color:#9ff0c8;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums}
.tlabel .live{font-size:12.5px;color:var(--gold2);font-weight:700;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums}
.tree.dead .tsvg{filter:grayscale(1) brightness(.75);opacity:.65}
.tree.dead .crown,.tree.dead .fruit,.tree.done .crown{animation:none}
.tree.done .tsvg{filter:drop-shadow(0 0 10px rgba(255,214,90,.8))}
.coins{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;overflow:visible}
.coin{position:absolute;left:50%;top:70px;white-space:nowrap;font-size:12px;font-weight:800;color:#fff3c4;
  font-family:'Inter',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.7);animation:rise 2.4s ease-out forwards}
.coin:before{content:"🪙 ";font-size:13px}
@keyframes rise{0%{opacity:0;transform:translate(var(--dx),10px) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.05)}}
.o-empty{color:#fff;text-align:center;padding:50px 16px;align-self:center}
.o-empty .big{font-size:56px}
@media (prefers-reduced-motion:reduce){.crown,.fruit,.sun,.cloud,.coin,.tree .tsvg{animation:none!important}.coin{display:none}}


</style>
</head>

  const list=S.deposits.slice().sort((a,b)=>a.startDate<b.startDate?-1:a.startDate>b.startDate?1:0);
  const field=$('#oField');
  if(!list.length){
    field.innerHTML='<div class="o-empty"><div class="big">🌱</div><h3 style="font-size:19px">ចំការនៅទទេ</h3><p style="margin:8px 0 16px;opacity:.9">ដាក់ប្រាក់បញ្ញើមួយ ដើម្បីដាំដើមឈើដំបូងរបស់អ្នក</p><button class="btn pri" data-act="add">🌱 ដាំដើមឈើដំបូង</button></div>';
    $('#oStats').innerHTML='';return;
  }
  field.innerHTML=list.map((d,i)=>{
    const cls=d.state==='closed'?'dead':d.state==='matured'?'done':'';
    const b=S.bmap[d.bankId];
    const logo=b&&b.logo?`<img src="${b.logo}" alt="">`:'';
    const note=d.state==='closed'?'បានដកប្រាក់':d.state==='matured'?'ដល់កំណត់ 🎉':'+'+tiny(perSec(d),d.currency)+' /វិ';
    return `<div class="tree ${cls}" id="t-${d.id}" title="${esc(bn(d))}">
      <div class="coins"></div>${treeSvg(d,i)}
      <div class="tlabel"><div class="bn">${logo}<span>${esc(bn(d))}</span></div>
        <div class="num" style="font-size:12px;color:#d7e6ff">${money(d.principal,d.currency)}</div>
        <div class="ps">${note}</div>
        <div class="live" data-live="${d.id}">${tiny(liveAcc(d),d.currency)}</div></div></div>`;
  }).join('');
  renderOStats();
}
function renderOStats(){
  const act=S.deposits.filter(d=>d.state!=='closed');
  const chips=[`<div class="o-chip"><small>🌳 ចំនួនដើមឈើ</small><b>${S.deposits.length}</b></div>`];
  ['USD','KHR'].forEach(c=>{
    const a=act.filter(d=>d.currency===c);if(!a.length)return;
    const ps=a.filter(isProducing).reduce((x,d)=>x+perSec(d),0);
    const tot=a.reduce((x,d)=>x+liveAcc(d),0);
    chips.push(`<div class="o-chip"><small>⚡ ${c} / វិនាទី</small><b class="gold">+${tiny(ps,c)}</b></div>`);
    chips.push(`<div class="o-chip"><small>💰 ${c} ទទួលបានហើយ</small><b data-total="${c}">${tiny(tot,c)}</b></div>`);
  });
  $('#oStats').innerHTML=chips.join('');
}
function orchardTick(){
  if(document.hidden||!$('#v-orchard').classList.contains('on'))return;
  S.deposits.forEach(d=>{
    const el=document.getElementById('t-'+d.id);if(!el)return;
    const lv=el.querySelector('[data-live]');
    if(d.state!=='closed')lv.textContent=tiny(liveAcc(d),d.currency);
    if(isProducing(d)){
      const cn=el.querySelector('.coins'),c=document.createElement('span');
      c.className='coin';c.textContent='+'+tiny(perSec(d),d.currency);
      c.style.setProperty('--dx',(Math.random()*50-25).toFixed(0)+'px');
      cn.appendChild(c);setTimeout(()=>c.remove(),2500);
    }
  });
  ['USD','KHR'].forEach(c=>{
    const t=document.querySelector('[data-total="'+c+'"]');if(!t)return;
    t.textContent=tiny(S.deposits.filter(d=>d.state!=='closed'&&d.currency===c).reduce((x,d)=>x+liveAcc(d),0),c);
  });
}

setInterval(orchardTick,1000);
renderOrchard();
$('#pFoot').textContent='ធ្វើបច្ចុប្បន្នភាពចុងក្រោយ៖ '+D.updated+' · បង្កើតដោយ FD Manager';
</script>
</body>
